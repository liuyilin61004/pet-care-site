<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Care · 宠物健康管理</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Auth Overlay -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box" id="authBox"></div>
  </div>

  <div class="app-container" id="appContainer" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="brand-logo" src="listenhub-20260619-172147-o62fkg.png" alt="Pet Care">
        <span class="brand-name">Pet Care</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-module="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">首页</span>
        </a>
        <a class="nav-item" data-module="pets">
          <span class="nav-icon">🐱</span>
          <span class="nav-label">宠物档案</span>
        </a>
        <a class="nav-item" data-module="health">
          <span class="nav-icon">💉</span>
          <span class="nav-label">疫苗驱虫</span>
        </a>
        <a class="nav-item" data-module="medical">
          <span class="nav-icon">💊</span>
          <span class="nav-label">病例记录</span>
        </a>
        <a class="nav-item" data-module="ai">
          <span class="nav-icon">🤖</span>
          <span class="nav-label">AI 健康分析</span>
        </a>
        <a class="nav-item" data-module="community">
          <span class="nav-icon">💬</span>
          <span class="nav-label">宠友社区</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-profile" id="sidebarProfile" onclick="App.navigate('profile')" style="display:none;">
          <span class="sidebar-profile-avatar" id="sidebarAvatar">🐾</span>
          <span class="sidebar-profile-name" id="sidebarName"></span>
        </div>
        <div class="pet-count" id="petCount">🐾 0 只小可爱</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <h1 class="page-title" id="pageTitle">🏠 首页</h1>
        <div class="top-bar-actions" id="topBarActions"></div>
      </header>
      <div class="content-area" id="contentArea">
        <!-- Module content rendered here -->
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/home.js"></script>
  <script src="js/modules/pets.js"></script>
  <script src="js/modules/health.js"></script>
  <script src="js/modules/medical.js"></script>
  <script src="js/modules/ai.js"></script>
  <script src="js/modules/community.js"></script>
  <script src="js/modules/profile.js"></script>
  <script src="js/app.js"></script>
  <script>Auth.init();</script>
</body>
</html>
